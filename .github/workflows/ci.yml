name: Cambium Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Server Quality Gate: Lint, TypeCheck, Unit Tests (Vitest)
  # ============================================================================
  server-verification:
    name: Backend API Verification (NestJS 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run build

      - name: Execute Server Unit Test Suite (Vitest)
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_key_2026
          REDIS_URL: redis://localhost:6379

  # ============================================================================
  # 2. Client Quality Gate: Lint, TypeCheck, Next.js 16 Static Build
  # ============================================================================
  client-verification:
    name: Frontend UI Verification (Next.js 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Build Next.js 16 Production Chunks (54 Routes)
        run: |
          npm run build 2>&1 | tee build.log || {
            echo "::error::Next.js production build failed"
            echo "### Next.js Production Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:5000

  # ============================================================================
  # 3. Root Unit Test Gate: Jest
  # ============================================================================
  root-unit-tests:
    name: Root Unit Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Execute Root Unit Test Suite (Jest)
        run: npm run test:jest

  # ============================================================================
  # 4. Zero-Vulnerability Production Dependency Audit Gate
  # ============================================================================
  security-audit:
    name: Production Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Client Production Dependencies (0 High/Critical Allowed)
        run: npm --prefix client audit --omit=dev

      - name: Audit Server Production Dependencies (0 High/Critical Allowed)
        run: npm --prefix server audit --omit=dev

      - name: Audit Monorepo Production Dependencies (0 High/Critical Allowed)
        run: npm audit --omit=dev

  # ============================================================================
  # 5. Playwright E2E & WCAG 2.2 AA Smoke Gate
  # ============================================================================
  e2e-verification:
    name: Playwright E2E & Accessibility Suite (26 Tests)
    runs-on: ubuntu-latest
    needs: [client-verification]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix client ci

      - name: Install Playwright Chromium with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Prebuild Next.js Client Production Chunks
        run: npm --prefix client run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:5000

      - name: Execute Full Playwright E2E Test Suite (Headless Chromium)
        run: npx playwright test
        env:
          CI: 1
          BASE_URL: http://localhost:3000

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ============================================================================
  # 6. Docker Container Build Verification
  # ============================================================================
  container-verification:
    name: Docker Multi-Stage Build Quality Gate
    needs: [server-verification, client-verification, root-unit-tests, security-audit, e2e-verification]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Server Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: cambium/server:ci-test

      - name: Validate Client Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: cambium/client:ci-test
