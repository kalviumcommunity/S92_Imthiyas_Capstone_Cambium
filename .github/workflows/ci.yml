name: Cambium Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Server Quality Gate: Lint, TypeCheck, Unit Tests (Vitest)
  # ============================================================================
  server-verification:
    name: Backend API Verification (NestJS 10)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: TypeScript Static Typecheck
        run: npm --prefix server run build

      - name: Execute Server Unit Test Suite (Vitest)
        run: npm --prefix server test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_key_2026
          REDIS_URL: redis://localhost:6379

  # ============================================================================
  # 2. Client Quality Gate: Lint, TypeCheck, Next.js 15 Static Build
  # ============================================================================
  client-verification:
    name: Frontend UI Verification (Next.js 15)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Build Next.js 15 Production Chunks (49 Routes)
        run: npm --prefix client run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:5000

  # ============================================================================
  # 3. Docker Container Build Verification
  # ============================================================================
  container-verification:
    name: Docker Multi-Stage Build Quality Gate
    needs: [server-verification, client-verification]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Server Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: cambium/server:ci-test

      - name: Validate Client Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: cambium/client:ci-test
