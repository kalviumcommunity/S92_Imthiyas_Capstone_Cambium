name: Bug Report
description: Report a reproducible defect in Cambium Research
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Concise description of the observed failure vs expected behavior.
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Affected Route or API Endpoint
      placeholder: "/workspace or GET /api/v1/opportunities"
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Numbered minimal steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized Logs / Console Errors
      description: Strip tokens, emails, and confidential research text before pasting.
