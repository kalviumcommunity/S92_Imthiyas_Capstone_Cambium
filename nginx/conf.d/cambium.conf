# ==============================================================================
# CAMBIUM RESEARCH PLATFORM — EDGE ROUTING & REVERSE PROXY VIRTUAL HOSTS
# Enterprise SSL/TLS, WebSocket/SSE Gateways, and Static Asset Optimization
# ==============================================================================

# Upstream Backend Clusters
upstream cambium_client_upstream {
    server client:3000;
    keepalive 32;
}

upstream cambium_server_upstream {
    server server:5000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS Redirection & ACME Challenge (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name cambium.edu www.cambium.edu api.cambium.edu localhost;

    # Health check probe for container orchestrators (Docker, K8s, AWS ALB)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Enforce HTTPS Permanent Redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Unified Primary Production Virtual Host (Port 443 HTTPS)
# Serves Frontend UI (Next.js 15) and Unified API (/api/) on the same origin
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cambium.edu www.cambium.edu localhost;

    # SSL / TLS Modern Cryptographic Configuration
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Enterprise Hardened Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --------------------------------------------------------------------------
    # Next.js Static Cache Optimization (Immutable Chunks & Media)
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://cambium_client_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /public/ {
        proxy_pass http://cambium_client_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Server-Sent Events (SSE) Stream — Continuous Unbuffered Reactive Pipe
    # Matches /api/v1/events/stream and /events/stream
    # --------------------------------------------------------------------------
    location ~ ^/(api/v1/)?events/stream {
        proxy_pass http://cambium_server_upstream;
        proxy_http_version 1.1;

        # Disable buffering and chunking to allow instant SSE message flush
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;

        # Long-lived SSE timeout (24 hours)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # Socket.io Distributed WebSockets Gateway
    # Handles persistent connections for real-time scholar collaboration & chat
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://cambium_server_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Auth Endpoints Rate-Limiting Shield
    # Protects /api/v1/auth/ against brute-force attacks
    # --------------------------------------------------------------------------
    location ~ ^/api/v1/auth/(sign-in|sign-up|login|register) {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://cambium_server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # General REST API Proxy (/api/ -> NestJS 10 API Server)
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://cambium_server_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # Frontend Presentation Tier (Next.js 15 App Router)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://cambium_client_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 3. Dedicated API Subdomain Virtual Host (api.cambium.edu)
# For institutions and automated SDKs accessing the API directly
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.cambium.edu;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # SSE Stream
    location ~ ^/(api/v1/)?events/stream {
        proxy_pass http://cambium_server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # WebSockets
    location /socket.io/ {
        proxy_pass http://cambium_server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Auth Rate Limit
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://cambium_server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All API Endpoints
    location / {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://cambium_server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

