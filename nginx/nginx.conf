# ==============================================================================
# CAMBIUM RESEARCH PLATFORM — MASTER NGINX CONFIGURATION
# High-Performance Reverse Proxy, HTTP/2, Compression, and Security Shield
# Document ID: NGINX-CAMBIUM-2026-V2
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Format with Upstream Response Time and Client IP
    log_format cambium_combined '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'rt=$request_time urt=$upstream_response_time '
                                'host="$host"';

    access_log /var/log/nginx/access.log cambium_combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Performance & Network Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Request Body & Upload Buffers (Supports 50MB PDF/Artifact uploads)
    client_max_body_size 50M;
    client_body_buffer_size 256k;
    client_header_buffer_size 8k;
    large_client_header_buffers 4 16k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting Zones (DDoS and Brute-Force Shield)
    # 1. API general rate limit: 30 requests/sec per IP
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    # 2. Strict Auth rate limit: 5 requests/sec per IP (prevents password brute forcing)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Map for WebSocket Upgrade Header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Include Modular Virtual Hosts
    include /etc/nginx/conf.d/*.conf;
}

