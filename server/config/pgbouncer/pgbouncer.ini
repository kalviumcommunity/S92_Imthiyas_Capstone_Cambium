;; ====================================================================
;; Cambium Enterprise PgBouncer Configuration (Transaction Pooling)
;; Designed to sustain 5,000+ concurrent scholar connections
;; ====================================================================

[databases]
;; Direct connection to PostgreSQL Primary for Write Transactions
cambium = host=postgres_primary port=5432 dbname=cambium auth_user=postgres

;; Optional read-replica route for high-throughput analytics & queries
cambium_replica = host=postgres_replica port=5432 dbname=cambium auth_user=postgres

[pgbouncer]
;; IP and Port binding
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; Pool Configuration (Transaction-level pooling maximizes reuse)
pool_mode = transaction
max_client_conn = 5000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 15
reserve_pool_timeout = 3
max_db_connections = 150

;; Connection Lifecycles & Timeouts
server_idle_timeout = 60
server_connect_timeout = 5
server_login_retry = 2
query_timeout = 60
query_wait_timeout = 120
client_idle_timeout = 300

;; Low-level Socket Tuning
tcp_keepalive = 1
tcp_keepcnt = 3
tcp_keepidle = 60
tcp_keepintvl = 10

;; Logging & Diagnostics
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
verbose = 0
