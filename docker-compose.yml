# ==============================================================================
# CAMBIUM RESEARCH PLATFORM — PRODUCTION DOCKER COMPOSE STACK
# Enterprise Research Operating System Topology (Postgres+pgvector, Redis, API, UI)
# Document ID: DOCKER-CAMBIUM-2026-V2
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 + pgvector HNSW Engine (System of Record + Vector Store)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cambium_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cambium
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-2Live&letLive}
    ports:
      - "5432:5432"
    volumes:
      - cambium_pgdata:/var/lib/postgresql/data
      - ./server/src/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cambium"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cambium_mesh

  # ----------------------------------------------------------------------------
  # 2. Redis 7 (Socket.io Adapter, BullMQ Queues, Redlock, Rate Limiting)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cambium_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - cambium_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cambium_mesh

  # ----------------------------------------------------------------------------
  # 3. NestJS 10 Core Application Server (REST, SSE, WebSockets, Agentic RAG)
  # ----------------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cambium_server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-cambium_secret_key_jwt_token_2026}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-2Live&letLive}
      POSTGRES_DB: cambium
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-2Live%26letLive}@postgres:5432/cambium
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      CORS_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - cambium_mesh

  # ----------------------------------------------------------------------------
  # 4. Next.js 15 Presentation Client (Living Materials UI, App Router)
  # ----------------------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cambium_client
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - cambium_mesh

# ------------------------------------------------------------------------------
# Persistent Enterprise Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  cambium_pgdata:
    name: cambium_pgdata
  cambium_redisdata:
    name: cambium_redisdata

# ------------------------------------------------------------------------------
# Isolated Internal Mesh Network
# ------------------------------------------------------------------------------
networks:
  cambium_mesh:
    name: cambium_mesh
    driver: bridge
